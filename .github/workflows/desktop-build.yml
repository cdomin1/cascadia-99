name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Panel-99-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
